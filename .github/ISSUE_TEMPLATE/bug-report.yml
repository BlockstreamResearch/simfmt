name: Bug Report
description: File a bug report for Simfmt
labels: [ 'bug', 'C-bug' ]
assignees:
  - ikripaka
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 🐛 Please provide a short summary, a minimal reproducible example, and any relevant configuration details.
  - type: input
    id: version
    attributes:
      label: "Simfmt version"
      placeholder: "0.1.2"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A brief description and the code snippet you tried to format.
      placeholder: |
        I tried to format this code:
        ```
        // your code here
        ```
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuration and CLI Options
      description: Include any CLI options used and your configuration file (e.g., simfmt.toml), if applicable.
      placeholder: |
        CLI options:
        $ simfmt <options>

        Configuration file:
        ```toml
        # configuration here
        ```
    validations:
      required: false
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Minimal reproduction steps
      description: The minimal steps needed to reproduce the bug
      placeholder: |
        1. Run...
        2. Observe...
    validations:
      required: true