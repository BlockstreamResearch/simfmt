[package]
name = "simfmt"
version = "0.0.2"
description = "Formatting tool for SimplicityHL"
authors = ["ikripaka <illia.kripaka@gmail.com>"]
categories = ["development-tools", "command-line-utilities", "text-processing"]
keywords = ["simplicity", "simplicityhl", "formatter", "cli", "simfmt"]
readme = "README.md"
license = "MIT"

edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/simfmt-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]
pkg-fmt = "tgz"

[[bin]]
name = "simfmt"
path = "src/bin/main.rs"

[lints]
workspace = true

[dependencies]
prettysimf = { workspace = true }

anyhow = { workspace = true }
getopts = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
paste = "1.0.15"
smplx-std = { version = "0.0.9" }
