[package]
name = "simfmt"
version = "0.0.1"
description = "Formatting tool for SimplicityHL"
authors = ["ikripaka <illia.kripaka@gmail.com>"]
categories = ["development-tools", "command-line-utilities", "text-processing"]
keywords = ["simplicity", "simplicityhl", "formatter", "cli", "simfmt"]
readme = "README.md"
license = "MIT"

edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "simfmt"
path = "src/bin/main.rs"

[lints]
workspace = true

[dependencies]
prettysimf = { workspace = true }

anyhow = { workspace = true }
getopts = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
paste = "1.0.15"
smplx-std = { version = "0.0.9" }
