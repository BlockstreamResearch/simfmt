[package]
name = "simfmt"
version = "0.0.1"
description = "Formatting tool for SimplicityHL"
repository = "https://github.com/ikripaka/simplefmt"
readme = "README.md"
license.workspace = true
edition.workspace = true

[[bin]]
name = "simfmt"
path = "src/bin/main.rs"

[lints]
workspace = true

[dependencies]
prettysimf = { workspace = true }

anyhow = { workspace = true }
getopts = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing-subscriber = { workspace = true }
